# Fonts
font_family      family="JetBrainsMono Nerd Font" style="Medium"
bold_font        family="JetBrainsMono Nerd Font" style="Bold"
italic_font      family="JetBrainsMono Nerd Font" style="Medium Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"
font_size        13.0
disable_ligatures cursor

# Shell
shell             zsh
shell_integration enabled
editor            nvim
enable_audio_bell no

# Cursor
cursor_shape               beam
cursor_beam_thickness      1.5
cursor_underline_thickness 2.0
cursor_blink_interval      0.5 ease-in-out
cursor_stop_blinking_after 0
cursor_shape_unfocused     hollow
cursor_trail               1
cursor_trail_decay         0.2 0.8
cursor_trail_start_threshold 1
cursor_trail_color         none

# Window
hide_window_decorations true
remember_window_size no
initial_window_width  640
initial_window_height 480
window_padding_width  10
background_opacity    0.5
sync_to_monitor       no
confirm_os_window_close 0

# Rendering latency
repaint_delay 5
input_delay   1

# Scrollbar
scrollbar_handle_opacity       0
scrollbar_track_opacity        0
scrollbar_track_hover_opacity  0

# Clipboard / scrollback
copy_on_select        clipboard
strip_trailing_spaces smart
scrollback_lines      10000
scrollback_pager      nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
url_style             curly

# Remote control
allow_remote_control socket-only
listen_on            unix:@mykitty

# Tabs
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_align           left
tab_title_template        "{fmt.bold}{sup.index}{fmt.nobold} {tab.active_exe}"
active_tab_title_template "{fmt.bold}{sup.index} {tab.active_exe}{fmt.nobold}"

# Layouts
enabled_layouts vertical, tall, stack, splits

# Keys: vim-style nav on ctrl+shift, tabs on alt
map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window down
map ctrl+shift+k     neighboring_window up
map ctrl+shift+l     neighboring_window right
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+j move_window down
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+l move_window right
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+o     show_scrollback
map ctrl+shift+f     kitten hints --type linenum --linenum-action tab nvim +{line} {path}
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8

# Layout switching
map ctrl+shift+space next_layout
map ctrl+shift+alt+space last_used_layout
map alt+t goto_layout tall
map alt+s goto_layout stack
map alt+d goto_layout vertical
map alt+z toggle_layout stack

# Split Bias
map alt+v combine : goto_layout splits : layout_action bias 70
map alt+shift+v combine : goto_layout splits : launch --cwd=current --location=vsplit --bias=30
map alt+shift+h combine : goto_layout splits : launch --cwd=current --location=hsplit --bias=35
# Tall/Fat bias cycle + splits equalize helpers
# map alt+b layout_action bias 50 75 25 ==> Add once fixed
map alt+e layout_action equalize

# Theme
include themes/Matugen.conf
