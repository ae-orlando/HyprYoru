foreground            #dee4df
cursor                #dee4df
cursor_text_color     #0f1512

selection_background  #354c42
selection_foreground  #cee9db

url_color             #a6cce0

# --- ANSI Colors ---
# Slots are spread across distinct roles (no two slots share a color),
# so terminal apps addressing ANSI names stay distinguishable on any
# wallpaper. Names are slot labels only: actual hues come from the palette.
color0                #404944
color1                #ffb4ab
color2                #b3ccbf
color3                #a6f2d2
color4                #8ad6b7
color5                #a6cce0
color6                #c2e8fd
color7                #dee4df

# --- Bright ANSI (black split for readability; rest mirrored to 0-7) ---
# color8 is outline (brighter gray), color0 is outline_variant (faintest
# readable on surface). eza renders *.bak as bright-black (ANSI 90); mapping
# it to surface made backup files invisible on dark wallpapers.
color8                #89938d
color9                #ffb4ab
color10               #b3ccbf
color11               #a6f2d2
color12               #8ad6b7
color13               #a6cce0
color14               #c2e8fd
color15               #dee4df

