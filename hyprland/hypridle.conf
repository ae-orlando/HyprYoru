# hypridle - idle management daemon.
# A config file is required; hypridle won't run without one.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # run when receiving a dbus lock event
    lock_cmd = pidof hyprlock || hyprlock
    # run when the session is preparing to sleep
    before_sleep_cmd = loginctl lock-session
    # run after the session wakes up again
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 15 min idle -> lock the screen
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 20 min idle -> turn the display off (turn back on when activity resumes)
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}