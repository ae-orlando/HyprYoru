# Hyprlock config - matugen system palette
# Background uses set-wall.sh cache (updated on wallpaper change)
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/hyprlock/wallpaper.png
    blur_passes = 1
    contrast = 1
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = true
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $primary
    inner_color = $inner_color
    font_color = $on_surface
    fade_on_empty = false
    rounding = 15
    check_color = $secondary
    fail_color = $error
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $on_surface
    font_size = 16
    font_family = GoMono Nerd Font Propo
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo "$(date +"%-I:%M")"
    color = $on_surface
    font_size = 72
    font_family = GoMono Nerd Font Propo Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:15000] echo "$(~/.config/hypr/whatsong.sh)"
    color = $outline
    font_size = 13
    font_family = GoMono Nerd Font Propo
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] sh -c 'if [ -f /sys/class/power_supply/BAT0/capacity ]; then echo "Battery $(cat /sys/class/power_supply/BAT0/capacity)% ($(cat /sys/class/power_supply/BAT0/status))"; else echo ""; fi'
    color = $outline
    font_size = 13
    font_family = GoMono Nerd Font Propo
    position = 0, 70
    halign = center
    valign = bottom
}
