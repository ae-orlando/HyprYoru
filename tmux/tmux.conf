# tmux 3.7c + kitty 0.48.2
# Stock keybinds kept: prefix C-b

# --- terminal / shell ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"
set -g default-shell /bin/zsh
set -g focus-events on
set -s escape-time 0
set -g allow-passthrough on
set -g history-limit 50000

# --- behavior (stock keys, sane numbering) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g status-interval 5

# --- mouse / clipboard ---
# mouse off so kitty copy_on_select stays native
set -g mouse off
# OSC52 to kitty for y -> system clipboard, works over SSH too
set -g set-clipboard on

# --- copy mode: vi keys ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# C-b [ enter, q quit, C-b ] paste, C-b = list buffers

# --- panes follow kitty palette via color names ---
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"
set -g display-panes-colour brightblack
set -g display-panes-active-colour magenta
set -g clock-mode-colour magenta
set -g mode-style "bg=magenta,fg=black,bold"
# command prompt no longer covers bar: draws one line above it
set -g message-line 1
set -g message-style "bg=magenta,fg=black,bold"
set -g message-command-style "bg=black,fg=white"

# --- powerline status bar, palette names only so kitty theme switch recolors it ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=black,fg=white"
set -g status-left-length 40
set -g status-right-length 90

set -g status-left "#[bg=magenta,fg=black,bold]  #S #[bg=black,fg=magenta]"
set -g status-right "#{?client_prefix,#[bg=red,fg=black,bold] PREFIX #[bg=brightblack,fg=red],#[bg=black,fg=brightblack]}#[bg=brightblack,fg=white] %d-%b #[bg=brightblack,fg=cyan]#[bg=cyan,fg=black] %H:%M #[bg=cyan,fg=green]#[bg=green,fg=black,bold] #h"

setw -g window-status-separator ""
setw -g window-status-format "#[bg=black,fg=brightblack]#[bg=brightblack,fg=white] #I #W #[bg=black,fg=brightblack]"
setw -g window-status-current-format "#[bg=black,fg=blue]#[bg=blue,fg=black,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=black,fg=blue]"
setw -g window-status-activity-style "bg=black,fg=yellow"
setw -g window-status-bell-style "bg=red,fg=black,bold"
