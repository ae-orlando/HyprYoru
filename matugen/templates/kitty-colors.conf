# Matugen Kitty theme - generated from {{image}}
# --- Main Colors ---
# by ae. Orlando
# _______________________________________________________________________

background            {{ colors.surface.default.hex }}
foreground            {{ colors.on_surface.default.hex }}
cursor                {{ colors.on_surface.default.hex }}
cursor_text_color     {{ colors.surface.default.hex }}

selection_background  {{ colors.secondary_container.default.hex }}
selection_foreground  {{ colors.on_secondary_container.default.hex }}

url_color             {{ colors.tertiary.default.hex }}

# --- ANSI Colors ---
# Slots are spread across distinct roles (no two slots share a color),
# so terminal apps addressing ANSI names stay distinguishable on any
# wallpaper. Names are slot labels only: actual hues come from the palette.
color0                {{ colors.outline_variant.default.hex }}
color1                {{ colors.error.default.hex }}
color2                {{ colors.secondary.default.hex }}
color3                {{ colors.primary_fixed.default.hex }}
color4                {{ colors.primary.default.hex }}
color5                {{ colors.tertiary.default.hex }}
color6                {{ colors.tertiary_fixed.default.hex }}
color7                {{ colors.on_surface.default.hex }}

# --- Bright ANSI (black split for readability; rest mirrored to 0-7) ---
# color8 is outline (brighter gray), color0 is outline_variant (faintest
# readable on surface). eza renders *.bak as bright-black (ANSI 90); mapping
# it to surface made backup files invisible on dark wallpapers.
color8                {{ colors.outline.default.hex }}
color9                {{ colors.error.default.hex }}
color10               {{ colors.secondary.default.hex }}
color11               {{ colors.primary_fixed.default.hex }}
color12               {{ colors.primary.default.hex }}
color13               {{ colors.tertiary.default.hex }}
color14               {{ colors.tertiary_fixed.default.hex }}
color15               {{ colors.on_surface.default.hex }}

# --- UI Elements ---
active_tab_foreground   {{ colors.on_primary.default.hex }}
active_tab_background   {{ colors.primary.default.hex }}
inactive_tab_foreground {{ colors.on_primary_container.default.hex }}
inactive_tab_background {{ colors.primary_container.default.hex }}

active_border_color     {{ colors.primary.default.hex }}
inactive_border_color   {{ colors.outline.default.hex }}

# --- Marks ---
mark1_foreground        {{ colors.on_primary_fixed.default.hex }}
mark1_background        {{ colors.primary_fixed.default.hex }}
mark2_foreground        {{ colors.on_secondary_fixed.default.hex }}
mark2_background        {{ colors.secondary_fixed.default.hex }}
mark3_foreground        {{ colors.on_tertiary_fixed.default.hex }}
mark3_background        {{ colors.tertiary_fixed.default.hex }}
