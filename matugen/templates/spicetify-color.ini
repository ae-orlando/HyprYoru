; Matugen Spicetify colors - generated from {{image}}
; by ae. Orlando
; _______________________________________________________________________
;
; Single scheme [matugen], picked up by color_scheme in config-xpui.ini.
; Bare 6-digit hex, the format SpicetifyDefault/color.ini ships.
; Generated output: never edit the copy in Themes/matugen/color.ini.
; Edit this template and regenerate (set-wall.sh, or any matugen run).
;
; Role mapping follows how spicetify v2.46 actually consumes each key
; (cssHexColorMap + the colorVariableReplace patches in preprocess.go):
;   foregrounds  text subtext misc selected-row button button-active
;   backgrounds  main main-elevated sidebar player card highlight
;                highlight-elevated tab-active notification notification-error
;   alpha        shadow drives rgba(0,0,0,.x) shadows, button-disabled the
;                muted/disabled states - both want the desaturated tones.
; The play-button glyph is painted with main, and button/button-active also
; appear as accent text on main, so both accents stay the light end of their
; pair here and flip with the mode on their own.

[matugen]
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}
main               = {{colors.surface.default.hex_stripped}}
main-elevated      = {{colors.surface_container.default.hex_stripped}}
highlight          = {{colors.surface_container_high.default.hex_stripped}}
highlight-elevated = {{colors.surface_container_highest.default.hex_stripped}}
sidebar            = {{colors.surface_container_low.default.hex_stripped}}
player             = {{colors.surface_container.default.hex_stripped}}
card               = {{colors.surface_container_high.default.hex_stripped}}
shadow             = {{colors.shadow.default.hex_stripped}}
selected-row       = {{colors.secondary.default.hex_stripped}}
button             = {{colors.primary.default.hex_stripped}}
button-active      = {{colors.on_primary_container.default.hex_stripped}}
button-disabled    = {{colors.outline_variant.default.hex_stripped}}
tab-active         = {{colors.secondary_container.default.hex_stripped}}
notification       = {{colors.primary_container.default.hex_stripped}}
notification-error = {{colors.error_container.default.hex_stripped}}
misc               = {{colors.outline.default.hex_stripped}}
